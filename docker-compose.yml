# Starts every server in its own container: docker compose up --build
services:
  interface:
    build: ./interface
    ports: ["127.0.0.1:5000:5000"]   # only this computer; with HTTPS (docker-compose.https.yml) browsers use the proxy
    environment:
      ORCHESTRATOR_URL: http://orchestrator:5001
      CSRF_SECRET: ${CSRF_SECRET:-}              # T05: long random string, see .env.example
      COOKIE_SECURE: ${COOKIE_SECURE:-true}      # T05: false only for a demo over plain http
    depends_on: [orchestrator]

  orchestrator:
    build: ./orchestrator
    environment:
      PORT: 5001
      CMT_SERVICE_URL: http://cmt_service:5002
      AI_AGENT_URL: http://ai_agent:5003
    depends_on: [cmt_service, ai_agent]

  cmt_service:
    build: ./cmt_service
    environment:
      PORT: 5002
      DATABASE_URL: postgresql://cmt:${DB_PASSWORD}@db:5432/cmt
      UPLOAD_DIR: /data/uploads                  # T08: papers are stored here, outside the code folder
    volumes:
      - uploads:/data/uploads
    depends_on: [db]

  ai_agent:
    build: ./ai_agent
    environment:
      PORT: 5003
      CMT_SERVICE_URL: http://cmt_service:5002   # T13: the assistant calls the CMT service with the user's own token
    depends_on: [cmt_service]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cmt
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cmt
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  uploads:

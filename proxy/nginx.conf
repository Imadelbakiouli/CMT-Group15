# HTTPS in front of the interface server (T15, SEC-11). Browsers only talk to this proxy.
# Certificate and key come from ./certs (see scripts/make-dev-cert.sh).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;       # plain http is only used to jump to https
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;                          # do not tell which nginx version this is

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;        # no old, broken versions
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;   # browsers remember: https only

    client_max_body_size 21m;                   # a 20 MB PDF plus the rest of the form

    location / {
        proxy_pass http://interface:5000;
        proxy_set_header Host $http_host;       # the interface checks this against the Origin header (CSRF)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

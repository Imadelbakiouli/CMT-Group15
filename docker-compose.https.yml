# HTTPS in front of the interface (T15, SEC-11). Optional, add it to the normal file:
#   scripts/make-dev-cert.sh
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up --build
# Then open https://localhost (tried with Docker Desktop on a Mac, 24 Nov 2026).
services:
  proxy:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [interface]

  interface:
    environment:
      COOKIE_SECURE: "true"       # the CSRF cookie only travels over https
